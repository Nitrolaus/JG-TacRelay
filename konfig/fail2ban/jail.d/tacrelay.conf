# Beispiel-Jail für den Proxmox-HOST, nicht für den Container. Nach /etc/fail2ban/jail.d/tacrelay.conf kopieren,
# <CT-Nummer> im Pfad ersetzen und erst dann "enabled = true" setzen, wenn
#   1. in server.json "sperrliste": { "klartextDatei": "/var/log/funk/sperren.log" } steht und funk-server neu gestartet ist,
#   2. fail2ban-regex die Zeilen findet (siehe filter.d/tacrelay.conf),
#   3. der Test aus docs/HEIMSERVER-HAERTUNG.md zeigt, dass eine Sperre in der FORWARD-Kette wirklich greift.
# Der Hauptschutz bleibt die Sperrliste im funk-server; dieses Jail ist ein Zusatz.

[tacrelay]
enabled   = false
filter    = tacrelay
# Die Datei liegt im Container. Solange er läuft, sieht der Host sein Wurzelverzeichnis unter /var/lib/lxc/<CT-Nummer>/rootfs.
logpath   = /var/lib/lxc/<CT-Nummer>/rootfs/var/log/funk/sperren.log
backend   = polling
# Jede Zeile ist schon eine Sperre des Servers: eine reicht.
maxretry  = 1
findtime  = 1h
# Nicht länger als die erste Sperre des Servers (5 min) und nicht steigend: Am Host gibt es keinen Durchlass, und die
# Sperre trifft alle Ports, also auch Foundry. Ein Mitglied hinter derselben Adresse (CGNAT, Mobilfunk) käme sonst eine
# Stunde und länger weder in den Funk noch in Foundry, und 'funk-admin entsperren --ip' hebt diese Sperre nicht auf
# (dafür: fail2ban-client set tacrelay unbanip <adresse>). Länger und steigend sperrt der Server selbst.
bantime   = 5m
# Der Verkehr zum Container läuft über die Brücke des Hosts (vmbr0), nicht durch dessen INPUT-Kette. Deshalb FORWARD und
# alle Ports der Adresse: TCP 8443 und UDP 47443 des Funks, dazu alles andere, was der Host weiterreicht.
chain     = FORWARD
banaction = iptables-allports
# iptables-allports sperrt nur das Protokoll aus "protocol", und fail2ban nimmt dafür sonst tcp. Mit all auch UDP 47443.
protocol  = all
port      = 8443,47443
