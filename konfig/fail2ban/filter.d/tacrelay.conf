# fail2ban-Filter für die Klartextzeilen der eingebauten Sperrliste von JG TacRelay (A51).
#
# Die Zeilen schreibt funk-server nur, wenn in server.json "sperrliste": { "klartextDatei": "/var/log/funk/sperren.log" }
# steht (Voreinstellung: aus). Je neuer Sperre genau eine Zeile in fester Form:
#
#   2026-10-01T09:30:05Z FUNK-SPERRE ip=203.0.113.7 netz=203.0.113.7/32 dauer=300 stufe=1 anlass=HANDSHAKE kennung=p4#0a1b2c3d4e
#
# Der Hauptschutz ist die Sperrliste im Server selbst. fail2ban läuft, wenn überhaupt, auf dem Proxmox-Host und hält die
# Adresse dort schon an der Brücke fern; im unprivilegierten Container kann es keine Firewallregeln setzen.
# Anleitung: docs/HEIMSERVER-HAERTUNG.md, Abschnitt "fail2ban für den Funk". Prüfen auf dem Host:
#   fail2ban-regex /var/lib/lxc/<CT-Nummer>/rootfs/var/log/funk/sperren.log /etc/fail2ban/filter.d/tacrelay.conf

[Definition]
failregex = FUNK-SPERRE ip=<HOST> netz=\S+ dauer=\d+ stufe=\d+ anlass=[A-Z_]+ kennung=\S+
ignoreregex =
